<article class="group flex h-full flex-col bg-cream-50 border border-cream-300/80 transition duration-500 hover:-translate-y-2 hover:shadow-2xl hover:shadow-graphite-900/10">
  <a href="{% url 'core:product_detail' product.pk %}" class="relative block aspect-square overflow-hidden bg-cream-200" aria-label="{{ product.name }} detayı">
    {% if product.image %}
      <img src="{{ product.image.url }}?v=2" alt="{{ product.name }}" loading="lazy"
           class="h-full w-full object-cover transition duration-700 group-hover:scale-110">
    {% else %}
      <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-cream-200 to-sand-400/30">
        <span class="font-display text-6xl text-sand-500/50">{{ product.name|first }}</span>
      </div>
    {% endif %}
    <span class="absolute left-3 top-3 bg-graphite-900 px-3 py-1 text-[0.65rem] font-medium uppercase tracking-widest text-cream-50">{{ product.model_code }}</span>
  </a>
  <div class="flex flex-1 flex-col p-5">
    <p class="text-xs uppercase tracking-widest text-sand-600">{{ product.category.name }}</p>
    <h3 class="mt-2 font-display text-lg leading-snug">
      <a href="{% url 'core:product_detail' product.pk %}" class="hover:text-sand-600 transition-colors">{{ product.name }}</a>
    </h3>
    <div class="mt-auto grid grid-cols-2 gap-2 pt-5">
      <a href="{% url 'core:product_detail' product.pk %}" class="btn-outline !px-3 !py-2.5 !text-xs">Detay</a>
      <a href="https://wa.me/{{ whatsapp_number }}?text={{ 'Merhaba, '|add:product.model_code|add:' model kodlu '|add:product.name|add:' için teklif almak istiyorum.'|urlencode }}"
         target="_blank" rel="noopener" id="card-{{ product.pk }}-whatsapp"
         class="btn-primary !px-3 !py-2.5 !text-xs">Teklif Al</a>
    </div>
  </div>
</article>
