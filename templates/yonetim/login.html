<!DOCTYPE html>
<html lang="tr" class="h-full bg-[#f6f4ee]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | EKOMETAL</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-[#f8f6f0] via-[#edf2ee] to-[#e4ece5]">

  <!-- Arka Plan Zarafet Efektleri -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-[#1c3527]/5 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-[#c9ab6e]/10 blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Giriş Kartı -->
    <div class="bg-white/90 backdrop-blur-2xl rounded-3xl p-8 sm:p-10 border border-[#1c3527]/10 shadow-[0_30px_70px_-15px_rgba(20,40,30,0.12)]">
      
      <!-- Logo ve Başlık -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#14281e] border border-[#c9ab6e]/40 shadow-xl mb-4">
          <img src="/static/images/ekometal-icon-gold.png" alt="EKOMETAL Logo" class="w-10 h-10 object-contain">
        </div>
        <div class="inline-block px-3 py-1 rounded-full bg-[#1c3527]/5 text-[#14281e] text-[11px] font-semibold tracking-[0.2em] uppercase mb-2">
          EKOMETAL KOKPİT
        </div>
        <h1 class="text-2xl sm:text-3xl font-cinzel text-[#14281e] tracking-tight">Yönetici Girişi</h1>
        <p class="text-xs sm:text-sm text-[#1c3527]/70 mt-1.5">Teklifleri, ürünleri ve kataloğu yönetmek için giriş yapın.</p>
      </div>

      <!-- Hata Mesajı -->
      {% if error_message %}
      <div class="mb-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs sm:text-sm flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>{{ error_message }}</span>
      </div>
      {% endif %}

      <!-- Giriş Formu -->
      <form method="post" action="{% url 'core:admin_login' %}" class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-[#14281e] mb-2">
            Kullanıcı Adı
          </label>
          <div class="relative">
            <input type="text" id="username" name="username" required autofocus autocomplete="username"
                   placeholder="yonetici"
                   class="w-full rounded-xl border border-[#1c3527]/20 bg-cream-50/70 px-4 py-3.5 pl-11 text-sm text-[#14281e] placeholder:text-[#1c3527]/40 focus:border-[#1c2d26] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1c2d26]/10 transition-all">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#1c3527]/50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#14281e] mb-2">
            Şifre
          </label>
          <div class="relative">
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full rounded-xl border border-[#1c3527]/20 bg-cream-50/70 px-4 py-3.5 pl-11 pr-11 text-sm text-[#14281e] placeholder:text-[#1c3527]/40 focus:border-[#1c2d26] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1c2d26]/10 transition-all">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#1c3527]/50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <!-- Şifre Göster/Gizle Butonu -->
            <button type="button" id="toggle-password-btn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#1c3527]/50 hover:text-[#14281e] p-1">
              <svg class="w-4 h-4" id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit"
                class="w-full inline-flex items-center justify-center gap-2 bg-[#14281e] hover:bg-[#1e3c2e] text-white py-4 px-6 rounded-xl text-sm font-semibold tracking-wider uppercase shadow-xl transition-all duration-300 hover:scale-[1.01] active:scale-95 cursor-pointer">
          <span>Panele Giriş Yap</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Alt Bilgi & Siteye Dönüş -->
      <div class="mt-8 pt-6 border-t border-[#1c3527]/10 text-center">
        <a href="{% url 'core:home' %}" class="inline-flex items-center gap-1.5 text-xs text-[#1c3527]/70 hover:text-[#14281e] font-medium transition-colors">
          <span>←</span>
          <span>Ana Sayfaya Dön</span>
        </a>
      </div>

    </div>

    <!-- Güvenlik Notu -->
    <div class="mt-6 text-center text-xs text-[#1c3527]/50">
      🔒 EKOMETAL Yönetim Sistemi • SSL Korumalı Güvenli Bağlantı
    </div>

  </div>

  <script>
    const toggleBtn = document.getElementById('toggle-password-btn');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
      });
    }
  </script>
</body>
</html>
